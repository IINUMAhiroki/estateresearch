name: rls-check

# Minimal, free-tier-friendly CI: only re-checks RLS when migrations/tests
# actually change. Lint/typecheck/unit tests run locally via the Claude
# Code Stop hook; Vercel's own build catches compile errors on push.
on:
  pull_request:
    paths:
      - "supabase/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase (db only)
        run: supabase db start

      - name: Check RLS is enabled on every public table
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          DB_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres bash scripts/check-rls.sh

      - name: Run pgTAP tests
        run: supabase test db
